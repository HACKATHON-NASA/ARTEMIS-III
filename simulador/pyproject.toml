[project]
name = "simulador"
version = "0.1.0"
description = "Simulador AstroHealth: datos NASA (DONKI, OSDR), misión simulada y API FastAPI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
