# Recomendaciones por indicador y estado del semáforo.
# ⚠️ Orientación para la demo; no reemplaza el criterio médico.
# yellow_low / red_low: textos para valores POR DEBAJO del rango verde
# (si no existen, se usan yellow / red).

recommendations:
  hr:
    green: Frecuencia cardíaca normal. Mantener la rutina.
    yellow: Frecuencia fuera de lo habitual. Repetir la medición en reposo en 30 minutos.
    red: Frecuencia anormal. Suspender la actividad, medir de nuevo en reposo y avisar al médico de vuelo.
    yellow_low: Frecuencia baja. Repetir en reposo; si hay mareo, avisar.
    red_low: Frecuencia muy baja. Reposo acostado, nueva medición y aviso inmediato al médico de vuelo.
  bp_sys:
    green: Presión sistólica normal.
    yellow: Presión elevada. Reducir sal, hidratarse y repetir la medición mañana.
    red: Presión alta. Reposo, nueva medición en 15 minutos y consulta con el médico de vuelo.
    red_low: Presión baja. Acostarse, elevar las piernas, hidratarse y avisar al médico de vuelo.
  bp_dia:
    green: Presión diastólica normal.
    yellow: Diastólica elevada. Vigilar en las próximas mediciones.
    red: Diastólica alta. Reposo y consulta con el médico de vuelo.
    red_low: Diastólica baja. Hidratarse, evitar cambios bruscos de postura y avisar al médico de vuelo.
  glucose:
    green: Glucosa normal.
    yellow: Glucosa fuera de rango. Revisar la última comida y repetir en ayunas.
    red: Glucosa muy alterada. Confirmar con otra muestra y avisar al médico de vuelo.
    yellow_low: Glucosa algo baja. Tomar un refrigerio y repetir en 30 minutos.
    red_low: Hipoglucemia. Tomar 15 g de azúcar de acción rápida, repetir en 15 minutos y avisar.
  temp:
    green: Temperatura normal.
    yellow: Temperatura alterada. Hidratarse y repetir en 1 hora.
    red: Posible fiebre. Aislar si hay síntomas y avisar al médico de vuelo.
    yellow_low: Temperatura baja. Abrigarse y revisar la temperatura de la cabina.
    red_low: Posible hipotermia. Abrigar, revisar el control térmico y avisar al médico de vuelo.
  spo2:
    green: Saturación normal.
    yellow: Saturación algo baja. Revisar el sensor y la calidad del aire del módulo.
    red: Saturación baja. Oxígeno suplementario, revisar CO₂ de la cabina y avisar de inmediato.
  sleep:
    green: Sueño suficiente.
    yellow: Sueño corto. Ajustar la luz, el ruido y el horario de la próxima noche.
    red: Privación de sueño. Reducir tareas críticas mañana y revisar con el psicólogo de vuelo.
  mood:
    green: Ánimo estable.
    yellow: Ánimo bajo. Programar tiempo libre y contacto con la familia.
    red: Ánimo muy bajo. Sesión con el psicólogo de vuelo en la próxima ventana de comunicación.
  exercise_min:
    green: Ejercicio suficiente para proteger hueso y músculo.
    yellow: Ejercicio insuficiente. Completar la sesión de resistencia del día.
    red: Ejercicio muy bajo. Riesgo de pérdida ósea y muscular; recuperar la rutina mañana.
  radiation:
    green: Radiación dentro de lo esperado para el entorno.
    yellow: Radiación elevada. Reducir actividades extravehiculares y permanecer en zonas blindadas.
    red: Evento de radiación. Ir al refugio blindado y suspender las salidas hasta nuevo aviso.

default:
  green: Valor normal.
  yellow: Valor a vigilar.
  red: Valor fuera de rango. Avisar al médico de vuelo.
