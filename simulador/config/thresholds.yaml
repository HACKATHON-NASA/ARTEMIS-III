# Umbrales del semáforo por indicador.
# ⚠️ Referencias generales para la demo, NO criterio médico.
#
# Cada indicador define dos bandas anidadas:
#   green  → dentro = 🟢
#   yellow → dentro (pero fuera de green) = 🟡
#   fuera de yellow = 🔴
# Límites de cada banda: min (>=), max (<=), lt (<). Si falta, no hay límite.
#
# worse: hacia dónde empeora el indicador (para las tendencias)
#   up | down | away (alejarse del centro de la banda verde)
# stable_delta: cambio total en la ventana por debajo del cual la tendencia es "stable".
# alert_delta: empeoramiento total mínimo en los últimos 3 pasos para lanzar trend_alert
#              (≈ 2× el ruido diario normal: evita alertas por azar).
# trend_alerts: false para no generar alertas de tendencia de ese indicador.

indicators:
  hr:
    label: Frecuencia cardíaca
    unit: bpm
    green: {min: 60, max: 100}
    yellow: {min: 50, max: 120}
    worse: away
    stable_delta: 4
    alert_delta: 6

  bp_sys:
    label: Presión sistólica
    unit: mmHg
    green: {min: 90, lt: 120}
    yellow: {min: 90, lt: 140}
    worse: up
    stable_delta: 5
    alert_delta: 12

  bp_dia:
    label: Presión diastólica
    unit: mmHg
    green: {min: 60, lt: 80}
    yellow: {min: 60, lt: 90}
    worse: up
    stable_delta: 4
    alert_delta: 9

  glucose:
    label: Glucosa
    unit: mg/dL
    green: {min: 70, lt: 100}
    yellow: {min: 60, lt: 126}
    worse: away
    stable_delta: 6
    alert_delta: 10

  temp:
    label: Temperatura
    unit: °C
    green: {min: 36.1, max: 37.2}
    yellow: {min: 35.5, max: 38.0}
    worse: away
    stable_delta: 0.3
    alert_delta: 0.4

  spo2:
    label: Saturación de oxígeno
    unit: "%"
    green: {min: 95}
    yellow: {min: 90}
    worse: down
    stable_delta: 1
    alert_delta: 1.5

  sleep:
    label: Sueño
    unit: h
    green: {min: 7, max: 9}
    yellow: {min: 6}          # más de 9 h también es amarillo
    worse: down
    stable_delta: 0.4
    alert_delta: 0.6

  mood:
    label: Estado de ánimo
    unit: "1-5"
    green: {min: 4}
    yellow: {min: 3}
    worse: down
    stable_delta: 0.5
    alert_delta: 1

  exercise_min:
    label: Ejercicio
    unit: min
    # SIMULADOR.md: menos de 90 min/día aumenta el riesgo de hueso y músculo.
    green: {min: 90}
    yellow: {min: 45}         # supuesto de la demo
    worse: down
    stable_delta: 10
    alert_delta: 30

  radiation:
    label: Radiación
    unit: mSv/día
    # Relativa a la dosis base del entorno (environments.yaml):
    #   🟢 <= base × green_max_factor
    #   🟡 <= base × yellow_max_factor
    #   🔴 por encima, o si hay un evento SEP activo
    relative_to_environment: true
    green_max_factor: 1.0
    yellow_max_factor: 2.0
    worse: up
    stable_delta: 0.1
    alert_delta: 0.5
    trend_alerts: false       # depende del clima espacial, no del cuerpo

# Ajustes por entorno (se mezclan sobre los de arriba). Ejemplo:
# environment_overrides:
#   mars:
#     hr: {green: {min: 55, max: 100}}
environment_overrides: {}

scoring:
  points: {green: 100, yellow: 60, red: 20}
  weights:                     # el resto pesa 1
    hr: 1.5
    bp_sys: 1.5
    bp_dia: 1.5
    spo2: 1.5
    radiation: 1.5

trends:
  window: 7                    # últimas N mediciones
  consecutive_worsening: 3     # empeora N veces seguidas → trend_alert
